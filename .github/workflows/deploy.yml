name: Test, build, and deploy

on:
  push:
    branches: [main, qa]

permissions:
  contents: read
  packages: write

concurrency:
  group: exam1-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      IMAGE_REF: ghcr.io/dan38-cmyk/exam1:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate website
        run: |
          test -s index.html
          grep -q '<html' index.html
          grep -q '<h1>' index.html
          grep -q '</html>' index.html

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/dan38-cmyk/exam1" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE_REF" .

      - name: Test container
        run: |
          docker run -d --name website-test \
            -p 127.0.0.1:8088:80 "$IMAGE_REF"
          trap 'docker rm -f website-test' EXIT
          curl --retry 12 --retry-all-errors --retry-delay 2 \
            --max-time 10 -fsS http://127.0.0.1:8088/ \
            | grep -q '<h1>'

      - name: Push image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_REF"

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.exam1_ssh_private_key }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Select environment
        run: |
          if [ "${{ github.ref_name }}" = main ]; then
            echo "TARGET_ENV=prod" >> "$GITHUB_ENV"
            echo "SITE_URL=https://exam1.duckdns.org" >> "$GITHUB_ENV"
          else
            echo "TARGET_ENV=qa" >> "$GITHUB_ENV"
            echo "SITE_URL=https://qa.exam1.duckdns.org" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Droplet
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTIONS=(-i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTIONS[@]}" dan38@206.189.220.216 \
            "mkdir -p /home/dan38/exam1/$TARGET_ENV"

          scp "${SSH_OPTIONS[@]}" deploy/compose.yml deploy/deploy.sh \
            "dan38@206.189.220.216:/home/dan38/exam1/$TARGET_ENV/"

          printf '%s\n' "$REGISTRY_TOKEN" |
            ssh "${SSH_OPTIONS[@]}" dan38@206.189.220.216 \
              "bash /home/dan38/exam1/$TARGET_ENV/deploy.sh '$TARGET_ENV' '$IMAGE_REF'"

      - name: Check HTTPS site
        run: |
          curl --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 15 -fsS "$SITE_URL" | grep -q '<h1>'
          {
            echo "Site: $SITE_URL"
            echo "Image: $IMAGE_REF"
          } >> "$GITHUB_STEP_SUMMARY"
